      letter-spacing: -0.5px;

      background-clip: text;
    }
    .daily-summary {
      background: #0f172a;
      margin: 16px 16px 10px;
      padding: 16px;
      border-radius: 24px;

      justify-content: space-around;
      align-items: center;
      margin-bottom: 12px;
    }

      border-radius: 50%;
      width: 70px;
      height: 70px;

      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 4px solid #f97316;
      font-weight: bold;
    }
    .calorie-number {
      font-size: 1.5rem;
      color: #fff;
      line-height: 1;
    }
    .calorie-label {
      font-size: 0.6rem;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .goal-info {

      flex-direction: column;
      gap: 4px;
    }
    .goal-edit {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 2px;
    }
    .goal-input {

      background: #1e293b;
      border: 1px solid #f97316;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #fff;
      outline: none;
      text-align: center;
    }
    .goal-set-btn {

      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.7rem;
      cursor: pointer;
      font-weight: bold;
    }
    .progress-bar {
      width: 120px;
      height: 6px;
      background: #334155;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 2px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #f97316;
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    .macro-goals-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .macro-goal-item {
      flex: 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }
    .macro-label {
      font-size: 0.6rem;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .macro-values {
      font-size: 0.75rem;
      font-weight: 700;
    }
    .macro-input {

      background: transparent;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 2px 4px;

      color: #fff;
      text-align: center;

      margin-top: 2px;
    }

    .fat-color { color: #ef4444; }

    }

    }

      border-radius: 16px;
      border: 1px dashed #f97316;
    }

      color: #f97316;
      margin-bottom: 8px;
      font-weight: 600;
    }

      align-items: center;

      color: #f1f5f9;
      outline: none;

    .custom-input:focus {
      border-color: #f97316;
    }

      color: white;
      font-weight: bold;
      padding: 8px 14px;

      cursor: pointer;
      white-space: nowrap;

      color: #64748b;
      text-align: center;

  </div>

  <div class="daily-summary">
    <div class="calorie-row">
      <div class="calorie-circle">
        <span id="totalCaloriesDisplay" class="calorie-number">0</span>
        <span class="calorie-label">kcal</span>
      </div>
      <div class="goal-info">
        <span class="goal-text" style="font-size:0.8rem;">🎯 Daily goal</span>
        <div class="goal-edit">
          <input type="number" id="goalInput" class="goal-input" value="2000" min="100" max="10000" step="50">
          <button id="goalSetBtn" class="goal-set-btn">Set</button>
        </div>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <span id="remainingText" style="font-size:0.7rem; color:#94a3b8;">remaining 2000</span>
      </div>
    </div>
    <div class="macro-goals-row">
      <div class="macro-goal-item">
        <div class="macro-label protein-color">🥩 Protein</div>
        <div class="macro-values"><span id="totalProtein">0</span>/<input type="number" id="proteinGoal" class="macro-input" value="150" min="10" max="500" step="5">g</div>
      </div>
      <div class="macro-goal-item">
        <div class="macro-label carbs-color">🍞 Carbs</div>
        <div class="macro-values"><span id="totalCarbs">0</span>/<input type="number" id="carbsGoal" class="macro-input" value="250" min="10" max="800" step="5">g</div>
      </div>
      <div class="macro-goal-item">
        <div class="macro-label fat-color">🧈 Fat</div>
        <div class="macro-values"><span id="totalFat">0</span>/<input type="number" id="fatGoal" class="macro-input" value="65" min="5" max="300" step="5">g</div>
      </div>
    </div>
  </div>

  <div class="custom-add-section">
    <div class="custom-title">✏️ Add Custom Food Manually</div>
    <div class="custom-row">
      <input type="text" id="customFoodName" class="custom-input" placeholder="Food name" style="min-width:80px;">
      <input type="number" id="customCalories" class="custom-input" placeholder="Cal" min="1" style="max-width:50px;">
      <input type="number" id="customProtein" class="custom-input" placeholder="Prot" min="0" step="0.1" style="max-width:50px;">
      <input type="number" id="customCarbs" class="custom-input" placeholder="Carb" min="0" step="0.1" style="max-width:50px;">
      <input type="number" id="customFat" class="custom-input" placeholder="Fat" min="0" step="0.1" style="max-width:50px;">
      <input type="text" id="customServing" class="custom-input" placeholder="Serving" style="max-width:70px;">
      <button id="customAddBtn" class="custom-add-btn">+ Add</button>
    </div>
  </div>

  <div class="search-section">
    <div class="search-box">
      <input type="text" id="foodSearchInput" class="search-input" placeholder="Search 200+ foods or search online..." autocomplete="off">
      <button id="searchButton" class="search-btn">🔍</button>
    </div>
    <div id="searchStatus" style="font-size:0.75rem; color:#94a3b8; margin-left:8px;"></div>
  </div>

  <div class="food-list" id="foodResultsContainer">
    <div style="color:#64748b; text-align:center; padding:30px;">🔎 Search for a food or add custom entry above</div>
  </div>

  <div class="log-section">
    <div class="log-title">
      <span>📋 Today's log</span>
      <button id="clearLogBtn" class="reset-btn">Clear all</button>
    </div>
    <div id="todayLogContainer" style="max-height:180px; overflow-y:auto;">
      <div style="color:#475569; text-align:center; padding:10px;">No entries yet</div>
    </div>
  </div>
  <div class="note">⚡ 200+ foods offline • Online results auto-saved • Full macro tracking</div>
</div>

    let userDatabase = [];

    function loadUserDatabase() {
      try {
        const saved = localStorage.getItem('calorieTrackerUserDB');
        if (saved) userDatabase = JSON.parse(saved);
      } catch (e) {
        userDatabase = [];
      }
    }

    function saveUserDatabase() {
      localStorage.setItem('calorieTrackerUserDB', JSON.stringify(userDatabase));
    }

    function addToUserDatabase(foodName, calories, protein, carbs, fat, serving) {
      const exists = userDatabase.some(item => item.name.toLowerCase() === foodName.toLowerCase());
      if (!exists) {
        userDatabase.push({
          name: foodName,
          serving: serving || '1 serving',
          calories: calories,
          protein: protein || 0,
          carbs: carbs || 0,
          fat: fat || 0
        });
        saveUserDatabase();
        return true;
      }
      return false;
    }

    function getFullDatabase() {
      return [...OFFLINE_DATABASE, ...userDatabase];
    }

    // App state
    let dailyGoal = 2000;
    let proteinGoal = 150;
    let carbsGoal = 250;
    let fatGoal = 65;
    let todaysLog = [];
    let totalCalories = 0;
    let totalProtein = 0;
    let totalCarbs = 0;
    let totalFat = 0;

    // DOM elements
    const totalCalEl = document.getElementById('totalCaloriesDisplay');
    const progressFill = document.getElementById('progressFill');
    const remainingText = document.getElementById('remainingText');
    const goalInput = document.getElementById('goalInput');
    const goalSetBtn = document.getElementById('goalSetBtn');
    const proteinGoalInput = document.getElementById('proteinGoal');
    const carbsGoalInput = document.getElementById('carbsGoal');
    const fatGoalInput = document.getElementById('fatGoal');
    const totalProteinEl = document.getElementById('totalProtein');
    const totalCarbsEl = document.getElementById('totalCarbs');
    const totalFatEl = document.getElementById('totalFat');
    const foodResultsContainer = document.getElementById('foodResultsContainer');
    const todayLogContainer = document.getElementById('todayLogContainer');
    const searchInput = document.getElementById('foodSearchInput');
    const searchBtn = document.getElementById('searchButton');
    const clearLogBtn = document.getElementById('clearLogBtn');
    const searchStatus = document.getElementById('searchStatus');
    const connectionStatus = document.getElementById('connectionStatus');
    const customFoodName = document.getElementById('customFoodName');
    const customCalories = document.getElementById('customCalories');
    const customProtein = document.getElementById('customProtein');
    const customCarbs = document.getElementById('customCarbs');
    const customFat = document.getElementById('customFat');
    const customServing = document.getElementById('customServing');
    const customAddBtn = document.getElementById('customAddBtn');

    function loadFromStorage() {
      try {
        const savedGoal = localStorage.getItem('calorieTrackerGoal');
        if (savedGoal) dailyGoal = parseInt(savedGoal, 10) || 2000;
        const savedProteinGoal = localStorage.getItem('proteinGoal');
        if (savedProteinGoal) proteinGoal = parseInt(savedProteinGoal, 10) || 150;
        const savedCarbsGoal = localStorage.getItem('carbsGoal');
        if (savedCarbsGoal) carbsGoal = parseInt(savedCarbsGoal, 10) || 250;
        const savedFatGoal = localStorage.getItem('fatGoal');
        if (savedFatGoal) fatGoal = parseInt(savedFatGoal, 10) || 65;
        const savedLog = localStorage.getItem('calorieTrackerLog');
        if (savedLog) todaysLog = JSON.parse(savedLog);
        recalculateTotals();
      } catch (e) {
        console.warn("Could not load storage", e);
      }
      goalInput.value = dailyGoal;
      proteinGoalInput.value = proteinGoal;
      carbsGoalInput.value = carbsGoal;
      fatGoalInput.value = fatGoal;
      loadUserDatabase();
    }

    function saveToStorage() {
      localStorage.setItem('calorieTrackerGoal', dailyGoal);
      localStorage.setItem('proteinGoal', proteinGoal);
      localStorage.setItem('carbsGoal', carbsGoal);
      localStorage.setItem('fatGoal', fatGoal);
      localStorage.setItem('calorieTrackerLog', JSON.stringify(todaysLog));
    }

    function recalculateTotals() {
      totalCalories = 0;
      totalProtein = 0;
      totalCarbs = 0;
      totalFat = 0;
      todaysLog.forEach(entry => {
        totalCalories += entry.calories || 0;
        totalProtein += entry.protein || 0;
        totalCarbs += entry.carbs || 0;
        totalFat += entry.fat || 0;
      });
    }

    function updateUI() {
      totalCalEl.textContent = totalCalories;
      totalProteinEl.textContent = Math.round(totalProtein);
      totalCarbsEl.textContent = Math.round(totalCarbs);
      totalFatEl.textContent = Math.round(totalFat);
      
      const percent = Math.min((totalCalories / dailyGoal) * 100, 100);
      progressFill.style.width = `${percent}%`;
      const remaining = Math.max(dailyGoal - totalCalories, 0);
      remainingText.textContent = `remaining ${remaining} kcal`;
      
      renderTodayLog();
    }

    function renderTodayLog() {
      if (!todayLogContainer) return;
      if (todaysLog.length === 0) {
        todayLogContainer.innerHTML = '<div style="color:#475569; text-align:center; padding:10px;">No entries yet</div>';
        return;
      }
      
      let html = `<table class="log-table">
        <thead><tr>
          <th class="food-col">Food</th><th>Cal</th><th>P(g)</th><th>C(g)</th><th>F(g)</th><th></th>
        </tr></thead><tbody>`;
      
      todaysLog.forEach((entry, index) => {
        html += `<tr>
          <td class="food-col">${escapeHtml(entry.name)}<br><small style="color:#64748b;">${escapeHtml(entry.serving || '')}</small></td>
          <td>${entry.calories}</td>
          <td style="color:#3b82f6;">${Math.round(entry.protein || 0)}</td>
          <td style="color:#f59e0b;">${Math.round(entry.carbs || 0)}</td>
          <td style="color:#ef4444;">${Math.round(entry.fat || 0)}</td>
          <td><button class="remove-entry" data-index="${index}">✕</button></td>
        </tr>`;
      });
      
      html += `<tr class="total-row">
        <td><strong>TOTAL</strong></td>
        <td><strong>${totalCalories}</strong></td>
        <td style="color:#3b82f6;"><strong>${Math.round(totalProtein)}</strong></td>
        <td style="color:#f59e0b;"><strong>${Math.round(totalCarbs)}</strong></td>
        <td style="color:#ef4444;"><strong>${Math.round(totalFat)}</strong></td>
        <td></td>
      </tr></tbody></table>`;
      
      todayLogContainer.innerHTML = html;

      document.querySelectorAll('.remove-entry').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const index = parseInt(btn.getAttribute('data-index'), 10);
          removeEntry(index);
        });
      });
    }

    function removeEntry(index) {
      if (index >= 0 && index < todaysLog.length) {
        todaysLog.splice(index, 1);
        recalculateTotals();
        saveToStorage();
        updateUI();
      }
    }

    function addFoodToLog(foodName, calories, protein, carbs, fat, serving = '', quantity = 1) {
      if (!foodName || calories <= 0) return;
      todaysLog.push({
        name: foodName,
        calories: Math.round(calories * quantity),
        protein: Math.round((protein || 0) * quantity * 10) / 10,
        carbs: Math.round((carbs || 0) * quantity * 10) / 10,
        fat: Math.round((fat || 0) * quantity * 10) / 10,
        serving: quantity > 1 ? `${quantity}x ${serving}` : serving,
        timestamp: Date.now()
      });
      recalculateTotals();
      saveToStorage();
      updateUI();
    }

    function clearLog() {
      if (confirm('Clear all today\'s entries?')) {
        todaysLog = [];
        recalculateTotals();
        saveToStorage();
        updateUI();
      }
    }

    function searchOffline(query) {
      const q = query.toLowerCase().trim();
      if (!q) return [];
      const fullDB = getFullDatabase();
      return fullDB.filter(item => item.name.toLowerCase().includes(q));
    }

    function displayResults(results, isOnlineResult = false) {
      if (!foodResultsContainer) return;
      if (results.length === 0) {
        foodResultsContainer.innerHTML = `<div style="color:#94a3b8; text-align:center; padding:20px;">😕 No food found. Try custom entry above.</div>`;
        return;
      }
      foodResultsContainer.innerHTML = results.map((item) => {
        const name = item.name || item.food_name || 'Unknown';
        const serving = item.serving || item.serving_size || 'standard serving';
        const calories = item.calories || item.calories_per_serving || 0;
        const protein = item.protein || 0;
        const carbs = item.carbs || 0;
        const fat = item.fat || 0;
        const isOnline = item._onlineResult === true;
        return `
          <div class="food-item ${isOnline ? 'online-result' : ''}">
            <div class="food-info">
              <span class="food-name">${escapeHtml(name)}${isOnline ? '<span class="online-tag">WEB</span>' : ''}</span>
              <span class="food-serving">${escapeHtml(serving)} • ${calories} kcal</span>
              <span class="food-macros">
                <span class="protein-color">🥩${protein}g</span>
                <span class="carbs-color">🍞${carbs}g</span>
                <span class="fat-color">🧈${fat}g</span>
              </span>
            </div>
            <div class="food-actions">
              <input type="number" class="qty-input" value="1" min="0.25" max="20" step="0.25" 
                data-name="${escapeHtml(name)}" data-calories="${calories}" data-protein="${protein}" data-carbs="${carbs}" data-fat="${fat}" data-serving="${escapeHtml(serving)}" data-online="${isOnline}">
              <span class="cal-badge">${calories} kcal</span>
              <button class="add-btn" data-name="${escapeHtml(name)}" data-calories="${calories}" data-protein="${protein}" data-carbs="${carbs}" data-fat="${fat}" data-serving="${escapeHtml(serving)}" data-online="${isOnline}">+</button>
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.qty-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const qty = parseFloat(input.value) || 0;
          const baseCal = parseInt(input.getAttribute('data-calories'), 10);
          const badge = input.parentElement.querySelector('.cal-badge');
          const total = Math.round(baseCal * qty);
          badge.textContent = total + ' kcal';
          const addBtn = input.parentElement.querySelector('.add-btn');
          addBtn.setAttribute('data-calories', total);
        });
      });

      document.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const name = btn.getAttribute('data-name');
          const cal = parseInt(btn.getAttribute('data-calories'), 10);
          const protein = parseFloat(btn.getAttribute('data-protein')) || 0;
          const carbs = parseFloat(btn.getAttribute('data-carbs')) || 0;
          const fat = parseFloat(btn.getAttribute('data-fat')) || 0;
          const serving = btn.getAttribute('data-serving') || '';
          const isOnline = btn.getAttribute('data-online') === 'true';
          const qtyInput = btn.parentElement.querySelector('.qty-input');
          const qty = qtyInput ? parseFloat(qtyInput.value) || 1 : 1;
          
          if (name && !isNaN(cal)) {
            if (isOnline) {
              const baseCal = parseInt(btn.parentElement.querySelector('.qty-input').getAttribute('data-calories'), 10);
              const baseProtein = parseFloat(btn.parentElement.querySelector('.qty-input').getAttribute('data-protein')) || 0;
              const baseCarbs = parseFloat(btn.parentElement.querySelector('.qty-input').getAttribute('data-carbs')) || 0;
              const baseFat = parseFloat(btn.parentElement.querySelector('.qty-input').getAttribute('data-fat')) || 0;
              const wasAdded = addToUserDatabase(name, baseCal, baseProtein, baseCarbs, baseFat, serving);
              if (wasAdded) {
                searchStatus.textContent = '💾 Food saved to offline database!';
                setTimeout(() => { if (searchStatus.textContent.includes('💾')) searchStatus.textContent = ''; }, 2000);
              }
            }
            addFoodToLog(name, cal, protein, carbs, fat, serving, qty);
            btn.style.transform = 'scale(1.2)';
            setTimeout(() => { if(btn) btn.style.transform = ''; }, 150);
          }
        });
      });
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return '&#039;';
      });
    }

    async function searchOnlineCalories(query) {
      try {
        const usdaUrl = `https://api.nal.usda.gov/fdc/v1/foods/search?query=${encodeURIComponent(query)}&pageSize=6&api_key=DEMO_KEY`;
        const response = await fetch(usdaUrl);
        if (response.ok) {
          const data = await response.json();
          if (data.foods && data.foods.length > 0) {
            return data.foods.map(food => {
              const nutrients = food.foodNutrients || [];
              const energy = nutrients.find(n => n.nutrientName === 'Energy' && n.unitName === 'KCAL');
              const protein = nutrients.find(n => n.nutrientName === 'Protein');
              const carbs = nutrients.find(n => n.nutrientName === 'Carbohydrate, by difference');
              const fat = nutrients.find(n => n.nutrientName === 'Total lipid (fat)');
              return {
                name: food.description || 'Unknown',
                serving: food.servingSize || '100g',
                calories: energy ? Math.round(energy.value) : 0,
                protein: protein ? Math.round(protein.value * 10) / 10 : 0,
                carbs: carbs ? Math.round(carbs.value * 10) / 10 : 0,
                fat: fat ? Math.round(fat.value * 10) / 10 : 0,
                _onlineResult: true
              };
            }).filter(item => item.calories > 0);
          }
        }
      } catch (e) {
        console.log("USDA search failed, trying Open Food Facts...");
      }

      try {
        const offUrl = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&json=1&page_size=8`;
        const response = await fetch(offUrl);
        if (!response.ok) throw new Error('Network error');
        const data = await response.json();
        if (!data.products || data.products.length === 0) return [];
        
        return data.products.map(product => {
          const name = product.product_name || product.generic_name || 'Unknown';
          const serving = product.serving_size || '100g';
          let calories = 0, protein = 0, carbs = 0, fat = 0;
          if (product.nutriments) {
            calories = Math.round(product.nutriments['energy-kcal_100g'] || 0);
            protein = product.nutriments.proteins_100g || 0;
            carbs = product.nutriments.carbohydrates_100g || 0;
            fat = product.nutriments.fat_100g || 0;
          }
          return { 
            name, serving, calories, protein, carbs, fat,
            _onlineResult: true
          };
        }).filter(item => item.calories > 0);
      } catch (error) {
        console.warn("All online searches failed", error);
        return null;
      }
    }

    function updateConnectionStatus(online) {
      if (online) {
        connectionStatus.innerHTML = '🌐 Online';
        connectionStatus.style.color = '#a3e635';
      } else {
        connectionStatus.innerHTML = '📴 Offline mode';
        connectionStatus.style.color = '#f97316';
      }
    }

    async function performSearch() {
      const query = searchInput.value.trim();
      if (!query) {
        foodResultsContainer.innerHTML = '<div style="color:#64748b; text-align:center; padding:30px;">Type a food name or use custom entry above</div>';
        searchStatus.textContent = '';
        return;
      }

      searchStatus.textContent = '🔍 Searching offline + user database...';
      const offlineResults = searchOffline(query);
      
      if (offlineResults.length > 0) {
        displayResults(offlineResults);
        searchStatus.textContent = `✅ ${offlineResults.length} found in offline database`;
        return;
      }

      const isOnline = navigator.onLine;
      updateConnectionStatus(isOnline);
      
      if (isOnline) {
        searchStatus.textContent = '🌍 Searching USDA + Open Food Facts...';
        foodResultsContainer.innerHTML = '<div class="inline-loader"><span>⏳</span> Searching multiple databases...</div>';
        try {
          const onlineResults = await searchOnlineCalories(query);
          if (onlineResults === null) {
            foodResultsContainer.innerHTML = '<div style="color:#f97316; padding:20px;">⚠️ Online search failed. Use custom entry above.</div>';
          } else if (onlineResults.length === 0) {
            foodResultsContainer.innerHTML = '<div style="color:#94a3b8; padding:20px;">No results online either. Use custom entry above.</div>';
          } else {
            displayResults(onlineResults, true);
            searchStatus.textContent = `🌐 ${onlineResults.length} results — adding saves to offline DB`;
          }
        } catch (e) {
          foodResultsContainer.innerHTML = '<div style="color:#f97316;">Network error. Use custom entry.</div>';
        }
      } else {
        foodResultsContainer.innerHTML = '<div style="color:#f97316; padding:20px;">📡 Offline & not in database. Use custom entry above.</div>';
      }
    }

    function handleCustomAdd() {
      const name = customFoodName.value.trim();
      const calories = parseInt(customCalories.value, 10);
      const protein = parseFloat(customProtein.value) || 0;
      const carbs = parseFloat(customCarbs.value) || 0;
      const fat = parseFloat(customFat.value) || 0;
      const serving = customServing.value.trim() || '1 serving';
      
      if (!name) { alert('Please enter a food name'); return; }
      if (!calories || calories <= 0) { alert('Please enter valid calories'); return; }
      
      addToUserDatabase(name, calories, protein, carbs, fat, serving);
      addFoodToLog(name, calories, protein, carbs, fat, serving);
      customFoodName.value = '';
      customCalories.value = '';
      customProtein.value = '';
      customCarbs.value = '';
      customFat.value = '';
      customServing.value = '';
      searchStatus.textContent = '💾 Custom food saved!';
      setTimeout(() => { if (searchStatus.textContent.includes('💾')) searchStatus.textContent = ''; }, 2000);
    }

    function handleGoalSet() {
      const newGoal = parseInt(goalInput.value, 10);
      if (newGoal && newGoal >= 100 && newGoal <= 10000) {
        dailyGoal = newGoal;
        saveToStorage();
        updateUI();
      } else {
        alert('Please enter a goal between 100-10000 kcal');
        goalInput.value = dailyGoal;
      }
    }

    function saveMacroGoals() {
      proteinGoal = parseInt(proteinGoalInput.value, 10) || 150;
      carbsGoal = parseInt(carbsGoalInput.value, 10) || 250;
      fatGoal = parseInt(fatGoalInput.value, 10) || 65;
      saveToStorage();
    }

    // Event listeners
    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
    clearLogBtn.addEventListener('click', clearLog);
    customAddBtn.addEventListener('click', handleCustomAdd);
    goalSetBtn.addEventListener('click', handleGoalSet);
    
    proteinGoalInput.addEventListener('change', saveMacroGoals);
    carbsGoalInput.addEventListener('change', saveMacroGoals);
    fatGoalInput.addEventListener('change', saveMacroGoals);
    
    customFoodName.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleCustomAdd(); });
    customCalories.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleCustomAdd(); });
    goalInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleGoalSet(); });

    window.addEventListener('online', () => updateConnectionStatus(true));
    window.addEventListener('offline', () => updateConnectionStatus(false));

    loadFromStorage();
    updateUI();
    updateConnectionStatus(navigator.onLine);
    
    searchInput.addEventListener('focus', () => {
      if (!foodResultsContainer.innerText.includes('food-item') && searchInput.value.trim() === '') {
        const popular = getFullDatabase().slice(0, 6);
        displayResults(popular);
        searchStatus.textContent = '📋 Popular items (offline + saved)';
      }
    });

  })();
</script>
